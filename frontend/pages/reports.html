<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PesaSense-AI | Reports</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

    <!-- Navigation -->
    <nav>
        <h2>PesaSense-AI</h2>

        <a href="dashboard.html">Dashboard</a>
        <a href="transactions.html">Transactions</a>
        <a href="budgets.html">Budgets</a>
        <a href="reports.html">Reports</a>
        <a href="ai.html">AI Insights</a>

        <button id="logoutButton">Logout</button>
    </nav>


    <main class="container mt-4">

        <h1>Financial Reports</h1>

        <p>View and understand your financial activity.</p>


        <!-- Report Controls -->
        <section class="mt-4">

            <h2>Report Period</h2>

            <label for="reportType">Report Type</label>

            <select id="reportType">
                <option value="daily">Daily</option>
                <option value="weekly">Weekly</option>
                <option value="monthly" selected>Monthly</option>
                <option value="yearly">Yearly</option>
            </select>

            <label for="reportDate">Report Date</label>

            <input
                type="date"
                id="reportDate"
            >

            <button id="loadReportButton">
                Load Report
            </button>

        </section>


        <!-- Report Summary -->
        <section class="mt-5">

            <h2>Summary</h2>

            <div id="reportSummary">
                <p>Choose a report and load it.</p>
            </div>

        </section>


        <!-- Category Breakdown -->
        <section class="mt-5">

            <h2>Category Breakdown</h2>

            <div id="categoryBreakdown">
                <p>No report loaded.</p>
            </div>

        </section>


        <!-- Transactions -->
        <section class="mt-5">

            <h2>Transactions in Report</h2>

            <div id="reportTransactions">
                <p>No report loaded.</p>
            </div>

        </section>

    </main>


    <script src="../js/reports.js"></script>

</body>
</html>
