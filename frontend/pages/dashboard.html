<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PesaSense-AI | Dashboard</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

    <!-- Navigation -->
    <nav>
        <h2>PesaSense-AI</h2>

        <a href="dashboard.html">Dashboard</a>
        <a href="transactions.html">Transactions</a>
        <a href="budgets.html">Budgets</a>
        <a href="reports.html">Reports</a>
        <a href="ai.html">AI Insights</a>
        <button id="logoutButton">Logout</button>
    </nav>


    <!-- Dashboard -->
    <main class="container mt-4">

        <h1>Dashboard</h1>
        <p>Welcome back!</p>


        <!-- Financial Summary -->
        <section>

            <div>
                <h3>Total Income</h3>
                <p id="totalIncome">UGX 0</p>
            </div>

            <div>
                <h3>Total Expenses</h3>
                <p id="totalExpenses">UGX 0</p>
            </div>

            <div>
                <h3>Balance</h3>
                <p id="balance">UGX 0</p>
            </div>

            <div>
                <h3>Highest Expense Category</h3>
                <p id="highestCategory">-</p>
            </div>

        </section>


        <!-- Recent Transactions -->
        <section class="mt-4">

            <h2>Recent Transactions</h2>

            <div id="recentTransactions">
                <p>Loading transactions...</p>
            </div>

        </section>

    </main>


    <script src="../js/dashboard.js"></script>

</body>
</html>
