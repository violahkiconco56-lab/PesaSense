<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PesaSense-AI | Budgets</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

    <!-- Navigation -->
    <nav>
        <h2>PesaSense-AI</h2>

        <a href="dashboard.html">Dashboard</a>
        <a href="transactions.html">Transactions</a>
        <a href="budgets.html">Budgets</a>
        <a href="reports.html">Reports</a>
        <a href="ai.html">AI Insights</a>

        <button id="logoutButton">Logout</button>
    </nav>


    <main class="container mt-4">

        <h1>Budgets</h1>

        <p>Set and monitor your spending limits.</p>


        <!-- Add Budget -->
        <section class="mt-4">

            <h2>Add Budget</h2>

            <form id="budgetForm">

                <div>
                    <label for="category">Category</label>

                    <input
                        type="text"
                        id="category"
                        placeholder="e.g. Food"
                        required
                    >
                </div>

                <div>
                    <label for="limitAmount">Budget Limit</label>

                    <input
                        type="number"
                        id="limitAmount"
                        min="1"
                        placeholder="e.g. 30000"
                        required
                    >
                </div>

                <div>
                    <label for="month">Month</label>

                    <input
                        type="number"
                        id="month"
                        min="1"
                        max="12"
                        placeholder="e.g. 8"
                        required
                    >
                </div>

                <div>
                    <label for="year">Year</label>

                    <input
                        type="number"
                        id="year"
                        min="2000"
                        max="2100"
                        placeholder="e.g. 2026"
                        required
                    >
                </div>

                <button type="submit">
                    Add Budget
                </button>

            </form>

            <p id="budgetMessage"></p>

        </section>


        <!-- Budget Report -->
        <section class="mt-5">

            <h2>Budget Report</h2>

            <div id="budgetSummary">
                <p>Loading budget report...</p>
            </div>

        </section>


        <!-- Budget Alerts -->
        <section class="mt-5">

            <h2>Budget Alerts</h2>

            <div id="budgetAlerts">
                <p>Loading alerts...</p>
            </div>

        </section>

    </main>


    <script src="../js/budgets.js"></script>

</body>
</html>
